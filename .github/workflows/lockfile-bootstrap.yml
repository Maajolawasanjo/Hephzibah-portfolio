name: One-time npm lockfile bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate-and-verify-lockfile:
    if: github.repository == 'Maajolawasanjo/Hephzibah-portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the lockfile using the actual npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible installation
        run: npm ci --no-audit --no-fund
      - name: Verify the exact locked dependency set
        run: |
          npm run lint
          npm run typecheck
          npm run check:assets
          npm run build
      - name: Commit only verified package-lock.json
        run: |
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile update needed"
            exit 0
          fi
          git commit -m "chore(deps): commit npm lockfile verified by npm ci"
          git push origin HEAD:main
